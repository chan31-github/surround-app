# XcodeGen project definition. Run ./bootstrap.sh (or `xcodegen generate`)
# to produce Surround.xcodeproj, which is not committed.
name: Surround
options:
  bundleIdPrefix: com.chan31
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  SurroundCore:
    path: Packages/SurroundCore

settings:
  base:
    # Swift 6 language mode with main-actor default isolation (spec decision
    # 16): UI, view models and the capture session are main-actor without
    # annotation; helpers that background work calls are marked nonisolated.
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # iPhone and iPad (spec 6.7); the iPad is a viewing and browsing device.
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Off so the build-info script below can read the git repository.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Surround:
    type: application
    platform: iOS
    sources:
      - path: Surround
    dependencies:
      - package: SurroundCore
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    info:
      path: Surround/Info.plist
      properties:
        CFBundleDisplayName: Surround
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # iPhone stays portrait (decision 19, reversed in v0.6 after testing);
        # the iPad supports every orientation, with capture showing a prompt in
        # landscape and the viewer correcting its motion mapping for the
        # interface orientation.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        UIRequiredDeviceCapabilities: [arkit, arm64]
        NSCameraUsageDescription: Surround uses the camera to capture the photos that make up a sphere.
        NSLocationWhenInUseUsageDescription: Surround records where each sphere was captured and which way you were facing.
        NSMotionUsageDescription: Surround uses motion sensors so you can look around a sphere by moving your phone.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      # Writes the commit, commit count and build time into the bundle so the
      # app can show which build is running (see BuildInfo.swift).
      - name: Write build info
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/BuildInfo.plist
        script: |
          set -eu
          cd "$SRCROOT"
          HASH=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          if git diff --quiet HEAD 2>/dev/null && [ -z "$(git status --porcelain --untracked-files=no 2>/dev/null)" ]; then DIRTY=""; else DIRTY="+"; fi
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          OUT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BuildInfo.plist"
          mkdir -p "$(dirname "$OUT")"
          cat > "$OUT" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>commit</key><string>${HASH}${DIRTY}</string>
          <key>commitCount</key><integer>${COUNT}</integer>
          <key>builtAt</key><string>${DATE}</string>
          </dict></plist>
          PLIST
