# XcodeGen project definition. Run ./bootstrap.sh (or `xcodegen generate`)
# to produce Surround.xcodeproj, which is not committed.
name: Surround
options:
  bundleIdPrefix: com.chan31
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  SurroundCore:
    path: Packages/SurroundCore

settings:
  base:
    # Swift 6 language mode with main-actor default isolation (spec decision
    # 16): UI, view models and the capture session are main-actor without
    # annotation; helpers that background work calls are marked nonisolated.
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Surround:
    type: application
    platform: iOS
    sources:
      - path: Surround
    dependencies:
      - package: SurroundCore
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    info:
      path: Surround/Info.plist
      properties:
        CFBundleDisplayName: Surround
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit, arm64]
        NSCameraUsageDescription: Surround uses the camera to capture the photos that make up a sphere.
        NSLocationWhenInUseUsageDescription: Surround records where each sphere was captured and which way you were facing.
        NSMotionUsageDescription: Surround uses motion sensors so you can look around a sphere by moving your phone.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_PREVIEWS: YES
